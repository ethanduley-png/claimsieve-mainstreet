name: GitHub adversarial canary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-adversarial-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r python/requirements-test.txt
      - name: Run offline GitHub attack matrix
        run: PYTHONPATH=python:python/tests python scripts/github_canary_evaluation.py --output evidence/github-adversarial-canary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: github-adversarial-canary-report
          path: evidence/github-adversarial-canary.json
          if-no-files-found: ignore
