name: GitHub signed observer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-observer-adversarial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r python/requirements-test.txt
      - name: Reject forged/replayed observer receipts
        run: PYTHONPATH=python:python/tests python -m unittest discover -s python/tests -p 'test_github_observer_attestation.py' -v
      - name: Validate observer CLI syntax
        run: python -m py_compile python/github_observer_cli.py python/claimsieve_ref/github_observer_attestation.py
