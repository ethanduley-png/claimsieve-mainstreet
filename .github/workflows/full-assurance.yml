name: Full assurance candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: python -m pip install --disable-pip-version-check -r python/requirements-test.txt
      - run: bash scripts/test_all.sh
      - name: Compile Rocq and print assumptions
        run: |
          set -euo pipefail
          mkdir -p evidence/ci-rocq
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            rocq/rocq-prover:9.2 \
            bash -lc '
              set -euo pipefail
              cp -R /workspace/rocq /tmp/claimsieve-rocq
              cd /tmp/claimsieve-rocq
              rocq compile -Q . ClaimSieve Claimsieve.v
              rocq compile -Q . ClaimSieve DurableState.v
              rocq compile -Q . ClaimSieve ExecutionAssurance.v
              rocq compile -Q . ClaimSieve Check.v
              rocq compile -Q . ClaimSieve CheckDurableState.v
              rocq compile -Q . ClaimSieve CheckExecutionAssurance.v
            ' 2>&1 | tee evidence/ci-rocq/ROCQ_OUTPUT.txt
      - run: python scripts/package_release.py
      - run: python scripts/validate_release_archive.py ../claimsieve-mainstreet.zip
      - name: Stage validated release artifacts
        run: |
          set -euo pipefail
          mkdir -p evidence/release
          cp ../claimsieve-mainstreet.zip evidence/release/claimsieve-mainstreet.zip
          cp ../claimsieve-mainstreet.zip.sha256 evidence/release/claimsieve-mainstreet.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: claimsieve-mainstreet-v0.34-full-assurance-candidate
          path: evidence/
