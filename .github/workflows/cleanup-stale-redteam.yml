name: Clean stale observer parity evidence
on:
  push:
    branches:
      - agent/rust-observer-v2-parity
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rust-observer-v2-parity
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Replace stale limitation with executed v2 contract check
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run_durable_red_team.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from claimsieve_ref.runtime import Authority  # noqa: E402\n'
          new_import = old_import + 'from claimsieve_ref.verifier import verify_bundle  # noqa: E402\n'
          if text.count(old_import) != 1:
              raise SystemExit('runtime import anchor changed')
          text = text.replace(old_import, new_import)

          marker = '# Honest limitations.\n'
          if text.count(marker) != 1:
              raise SystemExit('limitations marker changed')
          executed_check = '''# 26. Shared observer receipt v2 wire contract.
          v2_bundle = json.loads(
              (ROOT / "vectors" / "valid_evidence_bundle_observer_v2.json").read_text(encoding="utf-8")
          )
          v2_schema = json.loads(
              (ROOT / "schemas" / "observer-receipt-v2.schema.json").read_text(encoding="utf-8")
          )
          trust_root = json.loads(
              (ROOT / "trust" / "fixture-trust-root.json").read_text(encoding="utf-8")
          )
          v2_receipts = [
              item
              for item in v2_bundle.get("receipts", [])
              if isinstance(item, dict)
              and item.get("schema_version") == "claimsieve.observer_receipt.v2"
          ]
          v2_receipt = v2_receipts[0] if len(v2_receipts) == 1 else None
          v2_required = set(v2_schema.get("required", []))
          v2_fields = set(v2_receipt) if isinstance(v2_receipt, dict) else set()
          v2_errors = verify_bundle(v2_bundle, trust_root)
          v2_contract_ok = (
              isinstance(v2_receipt, dict)
              and v2_fields == v2_required
              and v2_schema.get("additionalProperties") is False
              and v2_schema.get("properties", {})
              .get("schema_version", {})
              .get("const") == "claimsieve.observer_receipt.v2"
              and not v2_errors
          )
          record(
              "OBSERVER_RECEIPT_V2_WIRE_DIVERGENCE",
              "shared v2 vector exactly matches the authoritative schema and portable verifier semantics",
              (
                  f"receipts={len(v2_receipts)}, exact_fields={v2_fields == v2_required}, "
                  f"verifier_errors={v2_errors}"
              ),
              "BLOCKED" if v2_contract_ok else "BYPASS",
              "Cross-implementation receipt consumers can disagree",
              {
                  "schema_required": sorted(v2_required),
                  "receipt_fields": sorted(v2_fields),
                  "verifier_errors": v2_errors,
              },
              "Authoritative v2 schema plus one shared signed vector; the strict Rust workflow consumes the same vector.",
          )

          '''
          text = text.replace(marker, executed_check + marker)

          stale_start = '    (\n        "RUST_OBSERVER_RECEIPT_WIRE_PARITY",\n'
          start = text.find(stale_start)
          if start < 0:
              raise SystemExit('stale limitation start anchor changed')
          end = text.find('    ),\n', start)
          if end < 0:
              raise SystemExit('stale limitation end anchor changed')
          end += len('    ),\n')
          text = text[:start] + text[end:]
          if 'RUST_OBSERVER_RECEIPT_WIRE_PARITY' in text:
              raise SystemExit('stale limitation remains after deletion')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Execute durable red team and verify evidence
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r python/requirements-test.txt
          PYTHONPATH=python python scripts/run_durable_red_team.py > /tmp/durable-red-team.json
          python - <<'PY'
          import json
          report = json.load(open('evidence/DURABLE_RED_TEAM_REPORT.json', encoding='utf-8'))
          assert report['bypasses'] == 0, report
          assert report['limitations'] == 3, report
          rows = {item['attack']: item for item in report['results']}
          assert 'RUST_OBSERVER_RECEIPT_WIRE_PARITY' not in rows
          row = rows['OBSERVER_RECEIPT_V2_WIRE_DIVERGENCE']
          assert row['status'] == 'BLOCKED', row
          print(json.dumps({
              'total': report['total'],
              'blocked_or_detected': report['blocked_or_detected'],
              'bypasses': report['bypasses'],
              'limitations': report['limitations'],
              'observer_v2': row['actual_result'],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit validated evidence correction
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-stale-redteam.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace stale observer parity limitation'
          git push origin HEAD:agent/rust-observer-v2-parity
