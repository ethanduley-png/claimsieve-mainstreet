[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/kernel",
  "crates/ledger",
  "crates/runtime",
  "crates/compact-admission",
  "crates/durable-state",
  "crates/verifier",
  "crates/cli",
]

[workspace.package]
version = "0.33.0"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Proprietary"
authors = ["Ethan Duley and contributors"]

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
parking_lot = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
