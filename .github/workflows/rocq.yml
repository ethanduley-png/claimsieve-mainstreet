name: Rocq proofs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rocq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile Rocq model and audit assumptions
        run: |
          mkdir -p evidence
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/rocq \
            rocq/rocq-prover:9.2 \
            bash -lc '
              set -euo pipefail
              rocq compile -Q . ClaimSieve Claimsieve.v
              rocq compile -Q . ClaimSieve DurableState.v
              rocq compile -Q . ClaimSieve Check.v | tee ../evidence/ROCQ_ASSUMPTIONS.txt
              rocq compile -Q . ClaimSieve CheckDurableState.v | tee -a ../evidence/ROCQ_ASSUMPTIONS.txt
            '
      - name: Reject unproved assumptions
        run: '! grep -R -n -E "(^|[^A-Za-z])(Admitted|admit|Axiom|Parameter)([^A-Za-z]|$)" --include="*.v" rocq'
