name: OpenWorker Adapter

on:
  pull_request:
    paths:
      - "python/mainstreet_runtimes/openworker_*.py"
      - "python/tests/test_openworker_*.py"
      - ".github/workflows/openworker-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENWORKER_COMMIT: 86c57f0692a5a318e55d1b9e0188d798b9fc5690
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements-test.txt
      - name: Install repository test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-test.txt
      - name: Install exact pinned OpenWorker git commit
        run: |
          python -m pip install "coworker @ git+https://github.com/andrewyng/openworker.git@${OPENWORKER_COMMIT}"
      - name: Verify installed VCS provenance and native API seam
        env:
          PYTHONPATH: python
        run: |
          python - <<'PY'
          from mainstreet_runtimes.openworker_native_bridge import (
              PINNED_OPENWORKER_COMMIT,
              verify_pinned_openworker_runtime,
          )
          resolved = verify_pinned_openworker_runtime()
          if resolved != PINNED_OPENWORKER_COMMIT:
              raise SystemExit(f"unexpected OpenWorker commit: {resolved}")
          print(f"verified OpenWorker commit {resolved}")
          PY
      - name: Run OpenWorker contract and native adversarial tests
        env:
          PYTHONPATH: python
        run: |
          python -m unittest discover \
            -s python/tests \
            -p 'test_openworker_*.py' \
            -v
