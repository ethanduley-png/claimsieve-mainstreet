name: Full assurance candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: python -m pip install --disable-pip-version-check -r python/requirements-test.txt
      - run: ./scripts/test_all.sh
      - name: Compile Rocq and print assumptions
        run: |
          mkdir -p evidence/ci-rocq
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/rocq \
            rocq/rocq-prover:9.2 \
            bash -lc '
              set -euo pipefail
              rocq compile -Q . ClaimSieve Claimsieve.v
              rocq compile -Q . ClaimSieve DurableState.v
              rocq compile -Q . ClaimSieve Check.v
              rocq compile -Q . ClaimSieve CheckDurableState.v
            ' 2>&1 | tee evidence/ci-rocq/ROCQ_OUTPUT.txt
      - run: python scripts/package_release.py
      - run: python scripts/validate_release_archive.py ../claimsieve_mainstreet_v0_34_founder_operations_boundary.zip
      - uses: actions/upload-artifact@v4
        with:
          name: claimsieve-mainstreet-v0.34-full-assurance-candidate
          path: |
            ../claimsieve_mainstreet_v0_34_founder_operations_boundary.zip
            ../claimsieve_mainstreet_v0_34_founder_operations_boundary.zip.sha256
            evidence/
