name: Rocq proofs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rocq:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2
    steps:
      - uses: actions/checkout@v4
      - run: rocq compile -Q . ClaimSieve Claimsieve.v
        working-directory: rocq
      - run: rocq compile -Q . ClaimSieve DurableState.v
        working-directory: rocq
      - run: rocq compile -Q . ClaimSieve Check.v | tee ../evidence/ROCQ_ASSUMPTIONS.txt
        working-directory: rocq
      - run: rocq compile -Q . ClaimSieve CheckDurableState.v | tee -a ../evidence/ROCQ_ASSUMPTIONS.txt
        working-directory: rocq
      - run: '! grep -R -n -E "(^|[^A-Za-z])(Admitted|admit|Axiom|Parameter)([^A-Za-z]|$)" --include="*.v" rocq'
