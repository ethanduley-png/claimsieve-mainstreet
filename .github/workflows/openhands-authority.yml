name: OpenHands Authority Binding

on:
  pull_request:
    paths:
      - "python/mainstreet_runtimes/**"
      - "python/tests/test_openhands_*.py"
      - "scripts/run_openhands_boundary_red_team.py"
      - "docs/OPENHANDS_AUTHORITY_BINDING.md"
      - "docs/OPENHANDS_TRANSPORT_IDENTITY.md"
      - ".github/workflows/openhands-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-test.txt
      - name: Run OpenHands adapter and authority-intake tests
        env:
          PYTHONPATH: python
        run: |
          python -m unittest discover \
            -s python/tests \
            -p 'test_openhands_*.py' \
            -v

  adversarial-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-test.txt
      - name: Run OpenHands authority red team
        env:
          PYTHONPATH: python
        run: |
          python scripts/run_openhands_boundary_red_team.py \
            --output openhands-authority-red-team.json
      - name: Preserve adversarial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openhands-authority-red-team
          path: openhands-authority-red-team.json
          if-no-files-found: warn
