name: Reference tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  python-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install --disable-pip-version-check -r python/requirements-test.txt
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - run: PYTHONPATH=python python python/generate_bundle.py
      - run: PYTHONPATH=python python python/verify_bundle.py vectors/valid_evidence_bundle.json trust/fixture-trust-root.json
      - run: node --test mainstreet/test/*.test.js
      - run: python scripts/source_gate.py
      - run: PYTHONPATH=python python evidence/V033_PATCHED_TRACE_PROBE.py
      - run: PYTHONPATH=python python scripts/provider_contract_gate.py
      - run: PYTHONPATH=python python scripts/semantic_divergence_gate.py
      - run: PYTHONPATH=python python scripts/run_red_team.py
      - run: PYTHONPATH=python python scripts/run_durable_red_team.py
  migrate-python-containment:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/rust-observer-v2-parity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rust-observer-v2-parity
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply checked containment patch
        env:
          PATCH_Z64: >-
            
        run: |
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          Path('/tmp/python-containment.patch').write_bytes(zlib.decompress(base64.b64decode(os.environ['PATCH_Z64'])))
          PY
          git apply --check /tmp/python-containment.patch
          git apply /tmp/python-containment.patch
      - run: python -m pip install --disable-pip-version-check -r python/requirements-test.txt
      - name: Validate complete Python and red-team gates
        run: |
          set -euo pipefail
          PYTHONPATH=python python -m unittest discover -s python/tests -v
          python scripts/source_gate.py
          PYTHONPATH=python python scripts/run_durable_red_team.py
          python - <<'PY'
          import json
          report = json.load(open('evidence/DURABLE_RED_TEAM_REPORT.json', encoding='utf-8'))
          assert report['bypasses'] == 0, report
          assert report['limitations'] == 3, report
          print(json.dumps({
              'total': report['total'],
              'blocked_or_detected': report['blocked_or_detected'],
              'bypasses': report['bypasses'],
              'limitations': report['limitations'],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit validated containment source and restore CI
        run: |
          set -euo pipefail
          git restore evidence || true
          rm -f .github/workflows/python-containment-migration.yml
          git show HEAD^:.github/workflows/reference-tests.yml > .github/workflows/reference-tests.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python/claimsieve_ref/durable_state.py \
                  python/tests/test_durable_state.py \
                  python/tests/test_execution_assurance_profile.py \
                  vectors/execution_assurance_profile_v1.json \
                  docs/OPEN_EXECUTION_ASSURANCE_PROFILE.md \
                  docs/OPEN_SOURCE_READINESS.md \
                  .github/workflows/reference-tests.yml \
                  .github/workflows/python-containment-migration.yml
          git commit -m 'Close durable Python divergence containment gap'
          git pull --rebase origin agent/rust-observer-v2-parity
          git push origin HEAD:agent/rust-observer-v2-parity
