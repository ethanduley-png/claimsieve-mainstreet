apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-agent
  namespace: mainstreet-agent
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proposer-to-claimsieve-intake-only
  namespace: mainstreet-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mainstreet-openclaw
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: claimsieve-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: claimsieve-intake
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-claimsieve
  namespace: claimsieve-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intake-from-proposer
  namespace: claimsieve-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: claimsieve-intake
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mainstreet-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mainstreet-openclaw
      ports:
        - protocol: TCP
          port: 8443
