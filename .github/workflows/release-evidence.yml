name: Release evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install --disable-pip-version-check -r python/requirements-test.txt
      - run: bash scripts/test_all.sh
      - run: python scripts/package_release.py
      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/release
          cp ../claimsieve-mainstreet.zip evidence/release/
          cp ../claimsieve-mainstreet.zip.sha256 evidence/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claimsieve-mainstreet-v0.34-founder-operations-evidence
          path: |
            evidence/
            vectors/valid_evidence_bundle.json
            MANIFEST.sha256
