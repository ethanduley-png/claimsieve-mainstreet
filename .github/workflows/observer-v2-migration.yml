name: Observer v2 parity migration
on:
  push:
    branches:
      - agent/rust-observer-v2-parity
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rust-observer-v2-parity
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Apply checked observer v2 patch
        env:
          PATCH_Z64: >-
            
        run: |
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          Path('/tmp/observer-v2.patch').write_bytes(zlib.decompress(base64.b64decode(os.environ['PATCH_Z64'])))
          PY
          git apply --check /tmp/observer-v2.patch
          git apply /tmp/observer-v2.patch
      - name: Generate shared v2 vector and run Python tests
        run: |
          python -m pip install --disable-pip-version-check -r python/requirements-test.txt
          PYTHONPATH=python python python/generate_bundle.py
          PYTHONPATH=python python -m unittest discover -s python/tests -v
      - name: Format and validate Rust workspace
        working-directory: rust
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - name: Commit validated migration
        run: |
          set -euo pipefail
          rm .github/workflows/observer-v2-migration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement observer receipt v2 parity'
          git push origin HEAD:agent/rust-observer-v2-parity
