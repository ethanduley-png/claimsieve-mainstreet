name: Release evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install --disable-pip-version-check -r python/requirements-test.txt
      - run: bash scripts/test_all.sh
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: claimsieve-mainstreet-v0.34-founder-operations-evidence
          path: |
            ../claimsieve_mainstreet_v0_34_founder_operations_boundary.zip
            ../claimsieve_mainstreet_v0_34_founder_operations_boundary.zip.sha256
            evidence/
            vectors/valid_evidence_bundle.json
            MANIFEST.sha256
